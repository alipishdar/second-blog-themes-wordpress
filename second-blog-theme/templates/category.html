<!--
  WordPress block-theme category archive template.
  The template is HTML block markup, not PHP. The actual post list inherits
  the current category archive query so WordPress supplies the right posts.
-->
<!-- wp:template-part {"slug":"header","area":"header","tagName":"header"} /-->

<!-- wp:group {"tagName":"main","className":"category-page","layout":{"type":"constrained"}} -->
<main class="wp-block-group category-page">
  <!-- wp:group {"className":"site-container category-page__container","layout":{"type":"constrained"}} -->
  <div class="wp-block-group site-container category-page__container">
    <!-- wp:paragraph {"className":"category-breadcrumb"} -->
    <p class="category-breadcrumb"><a href="/">خانه</a><span aria-hidden="true">/</span><a href="/blog/">مجله</a><span aria-hidden="true">/</span><span aria-current="page">دسته‌بندی</span></p>
    <!-- /wp:paragraph -->

    <!-- wp:group {"className":"category-hero","layout":{"type":"constrained"}} -->
    <div class="wp-block-group category-hero">
      <!-- wp:group {"className":"category-hero__inner","layout":{"type":"constrained"}} -->
      <div class="wp-block-group category-hero__inner">
        <!-- wp:group {"className":"category-hero__copy","layout":{"type":"constrained"}} -->
        <div class="wp-block-group category-hero__copy">
          <!-- wp:paragraph {"className":"eyebrow"} -->
          <p class="eyebrow"><span class="eyebrow__dot" aria-hidden="true"></span>دسته‌بندی مقاله‌ها</p>
          <!-- /wp:paragraph -->

          <!-- wp:query-title {"type":"archive","showPrefix":false,"level":1,"className":"category-hero__title"} /-->
          <!-- wp:term-description {"className":"category-hero__description"} /-->

          <!-- wp:paragraph {"className":"hero-static-note"} -->
          <p class="hero-static-note">راهنماها و مقاله‌های مرتبط با این موضوع، از مقدماتی تا پیشرفته.</p>
          <!-- /wp:paragraph -->
        </div>
        <!-- /wp:group -->

        <!-- wp:html -->
        <div class="category-hero__art" aria-hidden="true">
          <div class="hero-art__orbit hero-art__orbit--one"></div>
          <div class="hero-art__orbit hero-art__orbit--two"></div>
          <div class="hero-art__panel hero-art__panel--back"><span></span><span></span><span></span></div>
          <div class="hero-art__panel hero-art__panel--front">
            <div class="hero-art__panel-top"><i></i><i></i><i></i><b>رویش / استودیو</b></div>
            <div class="hero-art__mock-title"></div><div class="hero-art__mock-line"></div><div class="hero-art__mock-line hero-art__mock-line--short"></div>
            <div class="hero-art__mock-cards"><span></span><span></span><span></span></div>
          </div>
          <div class="hero-art__badge hero-art__badge--top">UI / UX</div>
          <div class="hero-art__badge hero-art__badge--bottom"><span aria-hidden="true">✳</span> طراحی با فکر</div>
          <span class="hero-art__spark hero-art__spark--one">✳</span><span class="hero-art__spark hero-art__spark--two">＋</span>
        </div>
        <!-- /wp:html -->
      </div>
      <!-- /wp:group -->
    </div>
    <!-- /wp:group -->

    <!-- wp:search {"label":"جست‌وجو در مقاله‌ها","showLabel":false,"placeholder":"جست‌وجو در مقاله‌ها…","buttonText":"جست‌وجو","buttonUseIcon":false,"className":"category-search"} /-->

      <!-- wp:group {"className":"section-heading__copy","layout":{"type":"constrained"}} -->

        <!-- wp:paragraph {"className":"eyebrow eyebrow--muted"} -->
        <p class="eyebrow eyebrow--muted">کتابخانه محتوا</p>
        <!-- /wp:paragraph -->
        <!-- wp:heading {"level":2} -->
        <h2 class="wp-block-heading">مقاله‌های این دسته</h2>
        <!-- /wp:heading -->
        <!-- wp:paragraph {"className":"section-heading__description"} -->
        <p class="section-heading__description">نوشته‌های مرتبط، به ترتیب جدیدترین انتشار.</p>
        <!-- /wp:paragraph -->
      </div>
      <!-- /wp:group -->
    </div>
    <!-- /wp:group -->

            <!-- wp:post-date {"format":"j F Y","className":"post-card__date"} /-->

        <!-- wp:query-pagination-numbers /-->
        <!-- wp:query-pagination-next {"label":"بعدی"} /-->
      <!-- /wp:query-pagination -->

        <!-- /wp:paragraph -->
      <!-- /wp:query-no-results -->

  </div>
  <!-- /wp:group -->
</main>
